name: update-data

on:
  schedule:
    - cron: "17 */4 * * *"   # every 4 hours
  workflow_dispatch:
    inputs:
      limit:
        description: "Test run: fetch only this many files (leave empty for a normal run)"
        required: false
        default: ""

permissions:
  contents: write
  pages: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pull data from the European Parliament
        env:
          LIMIT: ${{ inputs.limit }}
        run: node scripts/update.mjs

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/data.json
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Update data"
            git pull --rebase
            git push
          fi

      - name: Ask GitHub Pages to rebuild
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
